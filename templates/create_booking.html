{% extends "base.html" %}

{% block title %}Создание брони{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="text-center mb-4">📅 Создание брони</h2>
                <form method="POST">
                    <div class="mb-3">
                        <label for="room_id" class="form-label">Выберите номер</label>
                        <select class="form-select" id="room_id" name="room_id" required>
                            <option value="">Выберите...</option>
                            {% for room in rooms %}
                                <option value="{{ room[0] }}">№{{ room[1] }} - {{ room[2] }} ({{ room[4] }} руб.)</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="guest_fio" class="form-label">ФИО гостя</label>
                        <input type="text" class="form-control" id="guest_fio" name="guest_fio" required>
                    </div>
                    <div class="mb-3">
                        <label for="guest_phone" class="form-label">Телефон</label>
                        <input type="text" class="form-control" id="guest_phone" name="guest_phone" required>
                    </div>
                    <div class="mb-3">
                        <label for="guest_email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="guest_email" name="guest_email" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="check_in" class="form-label">Дата заезда</label>
                            <input type="date" class="form-control" id="check_in" name="check_in" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="check_out" class="form-label">Дата выезда</label>
                            <input type="date" class="form-control" id="check_out" name="check_out" required>
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">Забронировать</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
